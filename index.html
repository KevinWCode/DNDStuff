<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ink & Initiative</title>
<meta name="theme-color" content="#1d1715"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700;800&family=Grenze:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Cinzel:wght@500;700&family=Orbitron:wght@500;700&family=Rajdhani:wght@500;700&family=Cormorant+Garamond:wght@500;700&family=IM+Fell+English&family=Crimson+Pro:wght@400;600&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<style>
/* Layout: sticky command bar on top; Explore = tabbed 3-column sheet; Combat = HUD over a docked 4-lane action bar. */
:root{
  --bg:#14100f; --bg2:#1d1715; --panel:#231b18; --panel2:#2e2420; --line:#4a3a33;
  --ink:#f3e6d8; --muted:#b39d8c; --accent:#ff7a2f; --accent2:#ffc56b; --glow:255,110,40;
  --good:#5fd38d; --warn:#f2c14e; --bad:#ff5468; --temp:#6fb7ff;
  --f-display:"Grenze","Palatino Linotype",Georgia,serif;
  --f-ui:"Barlow Semi Condensed","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --r:12px; --fs:1;
  color-scheme:dark;
}
:root[data-skin="steel"]{ --bg:#101417; --bg2:#161c20; --panel:#1c2328; --panel2:#262f36; --line:#3c4952; --ink:#e8eef2; --muted:#9aabb6; --accent:#9fd0ff; --accent2:#d9e6ef; --glow:150,200,255; }
:root[data-skin="verdant"]{ --bg:#0f1511; --bg2:#141d17; --panel:#19241c; --panel2:#213025; --line:#365140; --ink:#e7f2e3; --muted:#9fb7a2; --accent:#7fdc8a; --accent2:#d8e98a; --glow:120,220,140; }
:root[data-skin="radiant"]{ --bg:#15131a; --bg2:#1c1922; --panel:#24202c; --panel2:#2e2938; --line:#4b4360; --ink:#f6f0ff; --muted:#b5abc8; --accent:#ffd36b; --accent2:#fff1c4; --glow:255,210,110; }
:root[data-skin="arcane"]{ --bg:#efe4cc; --bg2:#e6d8bb; --panel:#f7eedb; --panel2:#eadcbf; --line:#c3ab80; --ink:#2b1d10; --muted:#6f5a40; --accent:#2a4fa8; --accent2:#7a1f2a; --glow:42,79,168;
  --good:#1f7a43; --warn:#9a6a00; --bad:#b3132f; --temp:#1f5fae; color-scheme:light; }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:calc(16px*var(--fs));line-height:1.35;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;font-variant-numeric:tabular-nums}
:root[data-skin="arcane"] body{background:radial-gradient(ellipse at 20% 0%,#f6ecd6,transparent 60%),radial-gradient(ellipse at 90% 100%,#dccaa3,transparent 55%),var(--bg)}
:root[data-skin="steel"] body{background:repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 5px),var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
.lbl{font-size:.72em;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg2);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:8px;flex-wrap:wrap}
.sigil{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;background:radial-gradient(circle at 35% 30%,rgba(var(--glow),.45),var(--panel2));border:2px solid var(--accent);flex:none}
.who{min-width:0;flex:1 1 160px}
.who h1{font-size:1.45em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .sub{color:var(--muted);font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.mode button{border:0;background:transparent;padding:10px 18px;border-radius:999px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.85em;color:var(--muted);min-height:44px}
.mode button.on{background:var(--accent);color:var(--bg);box-shadow:0 0 18px rgba(var(--glow),.55)}
.tbtn{min-width:48px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:inline-grid;place-items:center;padding:0 12px;font-weight:600;gap:2px}
.tbtn.on{border-color:var(--accent);color:var(--accent)}
.tbtn small{font-size:.65em;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tbtn:disabled{opacity:.4}
.tools{display:flex;gap:8px;flex-wrap:wrap}

.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:10px;color:var(--muted);font-weight:600;min-height:42px;white-space:nowrap}
.tabs button.on{color:var(--ink);background:var(--panel)}

main{padding-block:16px 40px}
body.combat main{padding-bottom:calc(var(--dock-h,260px) + 24px + env(safe-area-inset-bottom,0px))}

/* ---------- panels ---------- */
.grid3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.2fr);gap:16px;align-items:start}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.grid3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid3>.col3{grid-column:1/-1}}
@media (max-width:720px){.grid3,.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;position:relative}
.panel>h2,.ph{font-size:1.25em;display:flex;align-items:center;gap:8px;margin-bottom:10px;justify-content:space-between}
.ph h2{font-size:1em}
:root[data-skin="ember"] .panel.hot,:root:not([data-skin]) .panel.hot{animation:ember 3.2s ease-in-out infinite}
@keyframes ember{0%,100%{box-shadow:0 0 0 1px rgba(var(--glow),.25),0 0 14px rgba(var(--glow),.12)}35%{box-shadow:0 0 0 1px rgba(var(--glow),.45),0 0 24px rgba(var(--glow),.28)}55%{box-shadow:0 0 0 1px rgba(var(--glow),.3),0 0 10px rgba(var(--glow),.1)}80%{box-shadow:0 0 0 1px rgba(var(--glow),.5),0 0 28px rgba(var(--glow),.25)}}
:root[data-skin="steel"] .panel{background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px),var(--panel)}
:root[data-skin="arcane"] .panel{box-shadow:0 1px 0 rgba(0,0,0,.05),inset 0 0 40px rgba(160,120,60,.12)}
:root[data-skin="verdant"] .panel{background:radial-gradient(circle at 100% 0,rgba(var(--glow),.08),transparent 45%),var(--panel)}
:root[data-skin="radiant"] .panel.hot{box-shadow:0 0 0 1px rgba(var(--glow),.4),0 0 22px rgba(var(--glow),.18)}

/* stat tiles */
.abil{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ab{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 6px 8px;text-align:center;min-height:96px;user-select:none;position:relative}
.ab .m{font-size:2.1em;font-weight:700;line-height:1;margin-top:4px}
.ab .s{display:inline-block;margin-top:6px;padding:1px 10px;border-radius:999px;border:1px solid var(--line);font-size:.9em;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;user-select:none;position:relative;min-height:78px;display:flex;flex-direction:column;justify-content:center}
.tile .v{font-size:1.9em;font-weight:700;line-height:1.05}
.tile .v small{font-size:.45em;font-weight:600;color:var(--accent2)}
.ovr::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;transform:rotate(45deg);background:var(--accent2)}
[data-x]{cursor:pointer}
[data-x]:active{transform:scale(.98)}
.ac-shield{clip-path:polygon(50% 0,100% 12%,96% 62%,50% 100%,4% 62%,0 12%);padding-bottom:16px}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);min-height:44px;user-select:none}
.row:last-child{border-bottom:0}
.row .nm{flex:1;min-width:0}
.row .ab3{font-size:.72em;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;width:30px}
.row .val{font-weight:700;font-size:1.15em;min-width:46px;text-align:right}
.row .val small{font-size:.7em;color:var(--accent2);font-weight:600}
.row:nth-child(even){background:color-mix(in srgb,var(--panel2) 45%,transparent)}
.pm{width:22px;height:22px;display:grid;place-items:center;flex:none;border:0;background:none;padding:0}
.pm i{display:block;width:12px;height:12px;border:2px solid var(--muted);border-radius:50%}
.pm.p1 i{background:var(--accent);border-color:var(--accent)}
.pm.p2 i{background:var(--accent2);border-color:var(--accent2);border-radius:2px;transform:rotate(45deg)}
.passive{font-size:.85em;color:var(--muted);padding:4px 8px;border:1px dashed var(--line);border-radius:8px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:8px 14px;min-height:42px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,var(--panel2));box-shadow:0 0 14px rgba(var(--glow),.35)}
.chip.bad.on{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--panel2));box-shadow:none}
.chip .ct{font-size:.75em;color:var(--muted);font-weight:500}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 16px;min-height:46px;font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.dng{border-color:var(--bad);color:var(--bad)}
.btn.arm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.9em}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* HP */
.hp{display:flex;flex-direction:column;gap:10px}
.hpbar{position:relative;height:30px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.hpbar .f{position:absolute;inset:0 auto 0 0;border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1),background-color .6s}
.hpbar .t{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(135deg,var(--temp) 0 6px,color-mix(in srgb,var(--temp) 60%,transparent) 6px 12px);opacity:.85;transition:width .5s}
.hpbar .txt{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.7);color:#fff}
.hpnum{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hpnum .big{font-size:2.6em;font-weight:700;line-height:1}
.hpnum .tmp{color:var(--temp);font-weight:700}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:700;font-size:.8em;letter-spacing:.08em;text-transform:uppercase}
.badge.blood{background:color-mix(in srgb,var(--bad) 25%,transparent);color:var(--bad);border:1px solid var(--bad);animation:pulse 1.6s ease-in-out infinite}
.badge.blood::before{content:"";width:8px;height:10px;background:var(--bad);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
@keyframes pulse{50%{box-shadow:0 0 14px color-mix(in srgb,var(--bad) 60%,transparent)}}
.conc{background:color-mix(in srgb,var(--accent2) 18%,transparent);color:var(--accent2);border:1px solid var(--accent2)}
.pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pad button{min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:1.2em;font-weight:700}
.pad .ent{grid-column:span 1}
.hpin{display:flex;gap:8px;align-items:center}
.hpin .disp{flex:1;min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:flex-end;padding:0 14px;font-size:1.6em;font-weight:700;letter-spacing:.04em}
.hpin .disp em{font-style:normal;color:var(--muted);font-size:.6em;margin-right:auto}
.hpacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.hpacts button{min-height:54px;border-radius:10px;font-weight:800;letter-spacing:.04em;border:1px solid var(--line);background:var(--panel2)}
.hpacts .dmg{background:color-mix(in srgb,var(--bad) 75%,#000);border-color:var(--bad);color:#fff}
.hpacts .heal{background:color-mix(in srgb,var(--good) 55%,#000);border-color:var(--good);color:#fff}
.hpacts .tmpb{background:color-mix(in srgb,var(--temp) 45%,#000);border-color:var(--temp);color:#fff}
.flash-dmg{animation:fdmg .5s}
@keyframes fdmg{0%{box-shadow:inset 0 0 0 999px rgba(255,40,60,.35)}100%{box-shadow:inset 0 0 0 999px rgba(255,40,60,0)}}
.flash-heal{animation:fheal .6s}
@keyframes fheal{0%{box-shadow:inset 0 0 0 999px rgba(80,220,140,.3)}100%{box-shadow:inset 0 0 0 999px rgba(80,220,140,0)}}

.death{border:1px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel));border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ds{display:flex;gap:10px;align-items:center}
.ds button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--bg)}
.ds .s.on{background:var(--good);border-color:var(--good)}
.ds .f.on{background:var(--bad);border-color:var(--bad)}

/* pips */
.slots{display:flex;flex-direction:column;gap:10px}
.slotrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.slotrow .lv{width:56px;font-family:var(--f-display);font-size:1.1em}
.pip{width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);background:radial-gradient(circle at 35% 30%,var(--accent2),var(--accent) 60%);box-shadow:0 0 12px rgba(var(--glow),.55);padding:0;position:relative}
.pip.used{background:transparent;box-shadow:none;border-color:var(--line)}
.pip.drain{animation:drain .7s ease-out}
@keyframes drain{0%{transform:scale(1.25);box-shadow:0 0 30px rgba(var(--glow),1)}40%{transform:scale(.85)}100%{transform:scale(1)}}
.pip.drain::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px dashed rgba(var(--glow),.9);animation:crackle .7s ease-out forwards}
@keyframes crackle{0%{opacity:1;transform:scale(.6) rotate(0)}100%{opacity:0;transform:scale(1.6) rotate(60deg)}}
.pip.fill{animation:fillp .5s}
@keyframes fillp{0%{transform:scale(.5)}70%{transform:scale(1.15)}}
.res{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);flex-wrap:wrap}
.res:last-child{border-bottom:0}
.res .nm{flex:1 1 140px;min-width:0}
.res .nm small{display:block;color:var(--muted)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{width:44px;height:44px;border:0;background:var(--panel2);font-size:1.3em;font-weight:700}
.step span{min-width:52px;text-align:center;font-weight:700;font-size:1.1em}
.mini-pips{display:flex;gap:5px;flex-wrap:wrap}
.mini-pips i{width:14px;height:14px;border-radius:4px;background:var(--accent);transform:rotate(45deg);display:block}
.mini-pips i.u{background:transparent;border:1.5px solid var(--line)}

/* combat */
.hud{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.hud{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.hud>.hpcol{grid-column:1/-1}}
@media (max-width:720px){.hud{grid-template-columns:minmax(0,1fr)}}
.roundbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.roundbox .rn{font-family:var(--f-display);font-size:1.5em}
.endturn{background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000));color:var(--bg);border:0;border-radius:12px;min-height:52px;padding:0 22px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 0 20px rgba(var(--glow),.4)}
.sets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.atk{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px;user-select:none}
.atk .hit{font-size:1.6em;font-weight:800;min-width:64px;text-align:center}
.atk .hit small{display:block;font-size:.45em;color:var(--muted);font-weight:600;letter-spacing:.1em}
.atk .dm{text-align:right;font-weight:700}
.atk .dm small{display:block;color:var(--muted);font-weight:500}
.tag{display:inline-block;font-size:.72em;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);margin-right:4px;font-weight:600;letter-spacing:.04em}
.tag.m{border-color:var(--accent2);color:var(--accent2)}
.moves{display:flex;gap:4px;flex-wrap:wrap}
.moves button{width:30px;height:30px;border-radius:6px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 35%,transparent);padding:0}
.moves button.u{background:transparent;border-color:var(--line)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg2) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px}
.dock-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:720px){.dock-in{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lane{border:1px solid var(--line);border-radius:12px;background:var(--panel);display:flex;flex-direction:column;min-width:0;transition:opacity .3s,filter .3s,box-shadow .3s}
.lane.avail{border-color:var(--accent);box-shadow:0 0 0 1px rgba(var(--glow),.25),0 0 18px rgba(var(--glow),.22)}
.lane.spent{opacity:.55;filter:saturate(.3)}
.lane header{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.lane header .gem{width:14px;height:14px;transform:rotate(45deg);border:2px solid var(--accent);background:var(--accent);flex:none}
.lane.spent header .gem{background:transparent;border-color:var(--muted)}
.lane[data-lane="bonus"] .gem{border-radius:50%;transform:none}
.lane[data-lane="reaction"] .gem{clip-path:polygon(50% 0,100% 100%,0 100%);transform:none;border:0}
.lane[data-lane="free"] .gem{border-radius:3px;transform:none;background:transparent}
.lane header b{flex:1;font-family:var(--f-display);font-size:1.1em;font-weight:600}
.lane header button{min-height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);padding:0 10px;font-size:.8em;font-weight:700}
.cards{display:flex;flex-direction:column;gap:6px;padding:8px;overflow-y:auto;max-height:var(--lane-h,170px)}
.card{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 10px;text-align:left;min-height:48px;display:flex;flex-direction:column;justify-content:center}
.card b{font-weight:700;line-height:1.15}
.card span{font-size:.82em;color:var(--muted)}
.card.std{min-height:40px;padding:6px 10px}
.card.std b{font-weight:600;font-size:.95em}
.dock-toggle{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:-40px;min-height:36px;border-radius:10px 10px 0 0;border:1px solid var(--line);border-bottom:0;background:var(--bg2);padding:0 14px;font-weight:700;font-size:.85em}

/* spells */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.spgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.sp{perspective:900px;min-height:230px;border:0;background:none;padding:0;text-align:left}
.sp .in{position:relative;width:100%;height:100%;min-height:230px;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.sp.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,var(--panel2),var(--panel));padding:14px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.face.back{transform:rotateY(180deg);overflow-y:auto}
.face .lvl{position:absolute;top:10px;right:12px;font-family:var(--f-display);font-size:2.2em;color:rgba(var(--glow),.35);line-height:1}
.face h3{font-size:1.35em;padding-right:36px}
.face .meta{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.9em}
.face .meta dt{color:var(--muted)}
.face .meta dd{margin:0}
.face .ftr{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.face p{margin:0;font-size:.92em}
.shape{width:22px;height:22px;flex:none}
.levelbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.levelbar button{min-width:44px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:700}
.levelbar button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}

/* gear */
.sockets{display:flex;gap:14px;flex-wrap:wrap}
.sock{width:100px;height:116px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--line);display:grid;place-items:center;padding:2px}
.sock>div{width:100%;height:100%;clip-path:inherit;background:var(--bg);display:grid;place-items:center;text-align:center;padding:16px 10px;font-size:.8em;font-weight:700}
.sock.full{background:var(--accent)}
.sock.full>div{background:radial-gradient(circle at 50% 35%,rgba(var(--glow),.35),var(--panel2))}
.items .row .qty{color:var(--muted);min-width:34px;text-align:right}
.coins{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.coin{text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 4px}
.coin b{display:block;font-size:1.3em}
.coin input{width:100%;background:transparent;border:0;text-align:center;font-size:1.3em;font-weight:700}

/* notes */
.ink-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid var(--panel2);box-shadow:0 0 0 1px var(--line)}
.swatch.on{box-shadow:0 0 0 3px var(--accent)}
.ink-wrap{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#f4ecda;touch-action:none;position:relative}
#ink{display:block;width:100%;touch-action:none}
.ink-hint{position:absolute;right:12px;bottom:10px;font-size:.8em;color:#7d6a4f;pointer-events:none}
textarea.field,input.field,select.field{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px}
textarea.field{min-height:140px;resize:vertical;line-height:1.5}

/* log */
.log .row{font-size:.95em}
.log time{color:var(--muted);font-size:.85em;width:70px;flex:none}

/* overlays */
.xray{position:fixed;z-index:90;max-width:min(380px,calc(100vw - 32px));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:.95em;pointer-events:auto}
.xray .eq{font-weight:800;font-size:1.15em;margin-bottom:4px}
.xray .eq s{opacity:.55;font-weight:600}
.xray ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.xray li{display:flex;justify-content:space-between;gap:18px}
.xray li b{font-variant-numeric:tabular-nums}
.xray .x-ov{margin-top:8px;display:flex;gap:8px}
.xray .x-ov button{border:0;border-radius:8px;padding:6px 12px;background:var(--bg);color:var(--ink);font-weight:700;min-height:38px}
.xray .note{font-size:.85em;opacity:.75;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(var(--toast-b,40px) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--panel2);border:1px solid var(--accent);border-radius:16px;padding:12px 20px;box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 24px rgba(var(--glow),.3);text-align:center;min-width:220px;max-width:calc(100vw - 32px);animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}}
.toast .big{font-size:3em;font-weight:800;line-height:1;font-family:var(--f-display)}
.toast .big.crit{color:var(--good);text-shadow:0 0 18px var(--good)}
.toast .big.fumble{color:var(--bad)}
.toast .t1{font-weight:700}
.toast .t2{color:var(--muted);font-size:.9em}
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(560px,100%);max-height:calc(100% - 20px);overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sheet h2{font-size:1.4em}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.85em;color:var(--muted);font-weight:600}
.form label.full{grid-column:1/-1}
.form label.ck{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:1em}
.form label.ck input{width:24px;height:24px}
.form .field{color:var(--ink);font-weight:400}
.empty{color:var(--muted);font-style:italic;padding:8px 2px}
.edit-only{display:none!important}
body.editing .edit-only{display:inline-flex!important}
body.editing .ab,body.editing .tile{outline:1px dashed var(--accent);outline-offset:-3px}
.ico{width:20px;height:20px;display:inline-block;vertical-align:-4px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dicemode{border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:.88em;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:720px){.cards{--lane-h:96px}.lane header b{font-size:.95em}.mode button{padding:8px 14px}}

/* ===== HUD layer (direction A mockup): hex gems, HP ring, plate panels, glowing dock, one nav row.
   Loads after style.css and before themes.css, so the style-guide themes still restyle colours, borders and radii. ===== */
:root{--f-hud:"Rajdhani","Barlow Semi Condensed","Arial Narrow",sans-serif;--f-display:var(--f-hud);--r:4px;--nav-h:0px}
/* every theme uses the HUD type, as in the mockup (beats the per-theme font in themes.css) */
:root[data-skin][data-skin]{--f-display:var(--f-hud)}
.hex{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}

/* ---------- top bar ---------- */
.top-in{flex-wrap:nowrap;padding-block:0;min-height:64px;gap:12px}
.sigil{border:0;border-radius:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:color-mix(in srgb,var(--accent) 24%,var(--panel2));color:var(--accent);font-family:var(--f-hud);font-weight:700;width:44px;height:48px}
.who{flex:0 1 auto;min-width:90px}
.who h1{font-family:var(--f-hud);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:1.4em}
.who .sub{font-size:.82em}
.nav{display:flex;align-self:stretch;margin-left:6px;flex:none}
.nav button{border:0;background:none;font-family:var(--f-hud);font-weight:700;letter-spacing:.11em;text-transform:uppercase;font-size:.84em;color:var(--muted);padding:0 10px;display:flex;align-items:center;gap:7px;position:relative;min-height:64px;white-space:nowrap}
.nav button i{width:9px;height:9px;rotate:45deg;border:1.5px solid currentColor;display:block;flex:none}
.nav button.on{color:var(--ink)}
.nav button.on i{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px rgba(var(--glow),.7)}
.nav button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;background:var(--accent)}
.grow{flex:1 1 0;min-width:0}
.rnd{font-family:var(--f-hud);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:.9em;padding:8px 16px;border:1px solid rgba(var(--glow),.55);color:var(--accent);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);white-space:nowrap}
.minihp{display:grid;grid-template-columns:auto 110px;gap:2px 10px;align-items:center;font-size:.75em;color:var(--muted);border:0;background:none;padding:4px;text-align:left}
.minihp b{font-family:var(--f-hud);font-size:1.75em;color:var(--ink);grid-row:1/3;line-height:1}
.minihp .hb{height:6px;background:var(--line);position:relative;display:block}
.minihp .hb i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.minihp .hb i.t{background:var(--temp)}
.minihp.bl b,.minihp.bl .hb i:first-child{color:var(--bad);background:var(--bad)}
.minihp.bl b{background:none}
.tools{flex-wrap:nowrap;gap:6px;flex:none}
.tbtn{min-width:44px;min-height:44px;padding:0 8px;border-radius:var(--r);position:relative}
.tbtn small{position:absolute;top:2px;right:4px;font-family:var(--f-hud);font-weight:700;font-size:.7em;color:var(--accent);letter-spacing:0}

/* ---------- panels ---------- */
.panel{background:linear-gradient(170deg,var(--panel2),var(--panel));border-radius:var(--r)}
.panel.hot::before{content:"";position:absolute;left:-1px;top:-1px;width:14px;height:14px;border-left:2px solid var(--accent);border-top:2px solid var(--accent);pointer-events:none}
.ph{margin-bottom:12px}
.ph h2{font-family:var(--f-hud);font-weight:700;font-size:.8em;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px;flex:1}
.ph h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.ph>.muted,.ph>span{font-size:.85em}
.tile,.ab,.atk,.card,.face,.lane,.chip,.btn,.coin,.step,.pad button,.hpacts button,.hpin .disp,.levelbar button{border-radius:var(--r)}
.tile .v,.ab .m,.atk .hit,.row .val,.step span,.rn,.toast .big,.hpin .disp,.pad button,.coin input,.lane header b,.slotrow .lv,.passive b{font-family:var(--f-hud);font-weight:700}
.tile .v{font-size:2.1em}
.lbl{font-family:var(--f-hud);letter-spacing:.16em}
.pm i{border-radius:1px;rotate:45deg;width:10px;height:10px}
.pm.p2 i{transform:none;box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--accent2);background:var(--accent2)}
.row .val{font-size:1.3em}

/* ---------- hex ability gems ---------- */
.abil{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.abil.six{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.gemcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.ab.gem{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--line);padding:2px;border:0;border-radius:0;min-height:0;width:100%;max-width:120px;aspect-ratio:1/1.12}
.ab.gem .gi{clip-path:inherit;width:100%;height:100%;background:linear-gradient(160deg,var(--panel2),var(--panel)),var(--bg);display:grid;place-content:center;text-align:center}
.ab.gem .m{font-size:2.3em;margin:0;line-height:1}
.ab.gem .s{border:0;padding:0;margin:0;font-size:.85em}
.ab.gem .lbl{letter-spacing:.18em}
.ab.gem.hi{background:var(--accent);filter:drop-shadow(0 0 8px rgba(var(--glow),.35))}
.ab.gem.hi .m{color:var(--accent)}
.ab.gem.ovr::after{display:none}
.ab.gem.ovr .s{color:var(--accent2);font-weight:700}
.gsv{font-size:.82em;color:var(--muted);white-space:nowrap;padding:4px 6px;user-select:none;position:relative}
.gsv b{font-family:var(--f-hud);font-size:1.25em;color:var(--ink)}
.gsv.p b{color:var(--accent)}
body.editing .ab.gem{outline:0}
body.editing .ab.gem .gi{box-shadow:inset 0 0 0 2px var(--accent)}

/* ---------- HP ring ---------- */
.ring{position:relative;width:min(250px,100%);aspect-ratio:1;margin:0 auto -6px;user-select:none}
.ring svg{display:block;width:100%;height:100%}
.ring .hpf{stroke:var(--ink)}
.ring.bl .hpf{stroke:var(--bad)}
.ring .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.ring .big{font-family:var(--f-hud);font-weight:700;font-size:4.2em;line-height:.9}
.ring .of{color:var(--muted);font-weight:600}
.ring .tmp{color:var(--temp);font-weight:700;letter-spacing:.06em;font-size:.95em}
.ring .bl-at{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-family:var(--f-hud);font-weight:700;letter-spacing:.16em;font-size:.72em;color:var(--bad)}
.ring.bl .bl-at{animation:pulse-t 1.6s ease-in-out infinite}
@keyframes pulse-t{50%{opacity:.45}}
.ring.down .big{color:var(--bad)}
.hp .ph{margin-bottom:0}
.ds button{border-radius:0;rotate:45deg;width:34px;height:34px;margin:4px}
.hpacts button{font-family:var(--f-hud);font-weight:700;letter-spacing:.1em;text-transform:uppercase}

/* ---------- attacks ---------- */
.atk{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n h" "d h";background:linear-gradient(170deg,var(--panel2),var(--panel));position:relative;padding:12px 14px;gap:4px 14px}
.atk::before{content:"";position:absolute;left:-1px;top:-1px;width:12px;height:12px;border-left:2px solid var(--accent);border-top:2px solid var(--accent)}
.atk .an{grid-area:n;min-width:0}
.atk .an b{font-family:var(--f-hud);font-weight:700;font-size:1.3em;text-transform:uppercase;letter-spacing:.03em}
.atk .hit{grid-area:h;font-size:2.4em;align-self:center;text-align:right}
.atk .dm{grid-area:d;text-align:left;font-weight:600}
.atk .dm small{display:inline;margin-left:6px}
.chip{border-radius:var(--r);font-weight:600}
.chip.on{box-shadow:0 0 12px rgba(var(--glow),.3)}

/* ---------- slots, pips, movement ---------- */
.pip{border-radius:0;rotate:45deg;width:28px;height:28px;margin:4px}
.pip.drain::after{border-radius:0}
.moves button{border-radius:0;width:26px;height:26px}
.roundbox .rn{font-size:1.6em;text-transform:uppercase;letter-spacing:.06em}

/* ---------- combat layout ---------- */
.hud{grid-template-columns:minmax(280px,.85fr) minmax(0,1.45fr) minmax(0,1fr)}
.hud .hcol .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){
  .hud{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
  .hud>.hpcol,.hud>.hcol{grid-column:auto}
  .hud>.rcol{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .abil.six{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:720px){.hud{grid-template-columns:minmax(0,1fr)}.hud>.rcol{grid-template-columns:minmax(0,1fr)}}

/* ---------- dock: glowing lanes + End Turn plate ---------- */
.dock{background:var(--bg2)}
.dock-in{grid-template-columns:repeat(4,minmax(0,1fr)) minmax(140px,190px)}
.lane header b{text-transform:uppercase;letter-spacing:.12em;font-size:1em}
.lane.avail header .gem{box-shadow:0 0 12px rgba(var(--glow),.9)}
@media (prefers-reduced-motion:no-preference){.lane.avail{animation:lane-glow 2.6s ease-in-out infinite}@keyframes lane-glow{50%{box-shadow:0 0 0 1px rgba(var(--glow),.45),0 0 26px rgba(var(--glow),.35)}}}
.dock .endturn{border-radius:0;clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);background:var(--ink);color:var(--bg);box-shadow:none;font-family:var(--f-hud);font-weight:700;font-size:1.55em;letter-spacing:.14em;display:grid;place-content:center;gap:2px;min-height:64px}
.dock .endturn small{font-family:var(--f-ui);font-size:.5em;letter-spacing:.1em;opacity:.7;font-weight:600}
.endturn{font-family:var(--f-hud);border-radius:var(--r)}
@media (max-width:1000px){.dock-in{grid-template-columns:repeat(4,minmax(0,1fr))}.dock .endturn{grid-column:1/-1;min-height:52px;grid-auto-flow:column;align-items:center;gap:14px}}
@media (max-width:720px){.dock-in{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- spells ---------- */
.srail{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(220px,auto);gap:18px;align-items:center}
.srail .tiles{grid-template-columns:repeat(2,96px)}
.concbox{display:flex;align-items:center;gap:12px;border:1px solid var(--accent);padding:8px 8px 8px 14px;background:rgba(var(--glow),.07);border-radius:var(--r)}
.concbox .rg{width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;box-shadow:0 0 14px rgba(var(--glow),.5);flex:none}
.concbox .rg i{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.concbox div{flex:1;line-height:1.15;min-width:0}
.concbox b{font-family:var(--f-hud);font-size:1.15em;text-transform:uppercase;letter-spacing:.06em}
.concbox span:not(.rg){display:block;font-size:.8em;color:var(--muted)}
.concbox.off{border-color:var(--line);background:none}
.concbox.off .rg{border-color:var(--line);box-shadow:none}
@media (max-width:1000px){.srail{grid-template-columns:minmax(0,1fr) auto}.srail .concbox{grid-column:1/-1}}
@media (max-width:560px){.srail{grid-template-columns:minmax(0,1fr)}}
.lg{display:inline-grid;place-items:center;width:18px;height:18px;font-family:var(--f-hud);font-weight:700;font-size:.7em;border:1.5px solid currentColor;vertical-align:-3px;flex:none}
.lg.A{border-radius:50%}
.lg.B{clip-path:polygon(50% 0,100% 100%,0 100%);border:0;background:currentColor}
.lg.R{rotate:45deg;width:13px;height:13px;margin:0 2px}
.lg.F{border-radius:2px;width:14px;height:14px}
.sp .face .sptop{display:flex;gap:10px;align-items:flex-start}
.sp .face .lvl{position:static;width:36px;height:40px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--line);display:grid;place-items:center;font-family:var(--f-hud);font-weight:700;font-size:1.15em;color:var(--ink);flex:none;line-height:1}
.sp .face .lvl.c{background:var(--panel2);color:var(--muted);box-shadow:inset 0 0 0 2px var(--line)}
.sp .face h3{font-family:var(--f-hud);font-weight:700;text-transform:uppercase;font-size:1.2em;padding-right:0;line-height:1.05;letter-spacing:.02em}
.sp .face::before{content:"";position:absolute;left:-1px;top:-1px;width:12px;height:12px;border-left:2px solid var(--accent);border-top:2px solid var(--accent)}
.sp .face .meta{border-top:1px solid var(--line);padding-top:8px}
.sp.active .face:not(.back){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 22px rgba(var(--glow),.28)}

/* ---------- gear ---------- */
.sockets{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px}
.sockc{display:grid;justify-items:center;gap:8px;text-align:center;border:0;background:none;padding:0;color:inherit}
.sockc b{font-family:var(--f-hud);font-size:1em;line-height:1.1}
.sock{width:96px;height:108px;padding:2px;background:var(--line)}
.sock>span{width:100%;height:100%;clip-path:inherit;display:grid;place-items:center;background:repeating-linear-gradient(45deg,var(--panel) 0 6px,var(--panel2) 6px 12px)}
.sock.full{background:var(--accent);filter:drop-shadow(0 0 10px rgba(var(--glow),.4))}
.sock.full>span{background:radial-gradient(circle at 50% 40%,rgba(var(--glow),.3),var(--panel2) 70%),var(--bg);font-family:var(--f-hud);font-weight:700;font-size:1.7em;color:var(--accent)}
.coin{display:flex;flex-direction:column;align-items:center;gap:4px}
.coin .lbl{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;letter-spacing:0;font-size:.7em}
.coin:has(#coin-gp) .lbl{border-color:var(--accent);color:var(--accent)}

/* ---------- party ---------- */
.pstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pmem{display:grid;grid-template-columns:56px minmax(0,1fr);gap:5px 12px;align-items:center;padding:10px 12px;text-align:left;border:1px solid var(--line);background:linear-gradient(170deg,var(--panel2),var(--panel));border-radius:var(--r);color:inherit;position:relative}
.pmem .pt{grid-row:1/4;width:56px;height:62px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--line);padding:2px}
.pmem .pt span{width:100%;height:100%;clip-path:inherit;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,var(--panel2),var(--panel)),var(--bg);font-family:var(--f-hud);font-weight:700;font-size:1.5em}
.pmem.me{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 20px rgba(var(--glow),.22)}
.pmem.me .pt{background:var(--accent)}
.pmem.me .pt span{color:var(--accent)}
.pmem .pn{display:flex;justify-content:space-between;gap:8px;align-items:baseline;min-width:0}
.pmem .pn b{font-family:var(--f-hud);font-size:1.15em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmem .pn span{font-size:.78em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmem .hp{height:8px;background:var(--line);position:relative;display:block}
.pmem .hp i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.pmem .hp i.t{background:var(--temp)}
.pmem .hp s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad)}
.pmem.bl .hp i:first-child{background:var(--bad)}
.pmem .st{font-size:.8em;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pmem .st b{font-family:var(--f-hud);font-size:1.2em;color:var(--ink)}
.cond{font-size:.82em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--bad);color:var(--bad);padding:0 6px}
.cond.c{border-color:var(--accent);color:var(--accent)}
.init{display:flex;flex-direction:column;gap:6px}
.irow{display:grid;grid-template-columns:52px minmax(0,1fr) auto 44px;gap:12px;align-items:center;padding:8px 12px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r)}
.irow .iv{font-family:var(--f-hud);font-weight:700;font-size:1.7em;text-align:center;line-height:1}
.irow .in b{font-family:var(--f-hud);font-size:1.15em;text-transform:uppercase;letter-spacing:.03em}
.irow .in small{display:block;color:var(--muted);font-size:.8em}
.irow.foe{background:repeating-linear-gradient(135deg,var(--panel) 0 10px,var(--panel2) 10px 20px)}
.irow.foe .iv{color:var(--bad)}
.irow.cur{border-color:var(--accent);box-shadow:0 0 18px rgba(var(--glow),.25)}
.irow.done{opacity:.55}
.irow .now{font-family:var(--f-hud);font-weight:700;font-size:.75em;letter-spacing:.16em;background:var(--accent);color:var(--bg);padding:2px 8px}
.irow .x{width:44px;height:44px;border:1px solid var(--line);background:none;border-radius:var(--r);color:var(--muted)}

/* ---------- overlays ---------- */
.xray{background:var(--bg);color:var(--ink);border:1px solid var(--accent);border-radius:var(--r);box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 24px rgba(var(--glow),.2)}
.xray .x-ov button{background:var(--panel2);color:var(--ink)}
.toast{border-radius:var(--r)}

/* ---------- portrait / narrow: nav becomes a bottom tab bar ---------- */
@media (max-width:1000px){
  :root{--nav-h:62px}
  .who .sub{display:none}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--bg2);border-top:1px solid var(--line);margin:0;padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .nav button{flex-direction:column;justify-content:center;gap:6px;min-height:var(--nav-h);padding:0;font-size:.74em;letter-spacing:.08em}
  .nav button.on::after{top:0;bottom:auto}
  main{padding-bottom:calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
  body.combat main{padding-bottom:calc(var(--dock-h,320px) + 24px)}
  .dock{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:10px}
  .toast{bottom:calc(var(--toast-b,calc(var(--nav-h) + 24px)) + env(safe-area-inset-bottom,0px))}
}
@media (max-width:560px){.minihp{grid-template-columns:auto}.minihp span:not(.hb){display:none}.minihp .hb{display:none}.tools .tbtn[data-act="short"],.tools .tbtn[data-act="long"]{display:none}}

/* Evaluate a formula like "15 + DEX + 2", "1d8 + STR + PB" or "3+4". Returns {n, dice[]}. */
function evalF(f, ctx) {
  if (f == null) return null;
  const s = String(f).replace(/\s+/g, '').toUpperCase();

  while ((m = re.exec(s))) {

    if (/D\d+/.test(t)) { dice.push((op === '-' ? '-' : '') + t.toLowerCase().replace(/^d/, '1d')); continue; }

    if (/^\d+$/.test(t)) v = +t;

    ${hpRing(cur, max, tmp, R.bloodied)}
    ${death}
    ${targets.length > 1 ? `<div class="chips" aria-label="Apply to">${targets.map(([id, n]) => `<button class="chip ${ui.target === id ? 'on' : ''}" data-act="target" data-arg="${id}">${esc(n)}</button>`).join('')}</div>` : ''}
    <div class="hpin"><div class="disp" aria-live="polite" data-act="kp" data-arg="C" title="Tap to clear"><em>${ui.hpIn && parsed && /\+/.test(ui.hpIn) ? '= ' + parsed.n : 'Amount'}</em>${esc(ui.hpIn) || '0'}</div>
      ${R.resistBPS || hasForm ? `<button class="chip ${ui.bps ? 'on' : ''}" data-act="bps" title="Bludgeoning, piercing or slashing">B/P/S${R.resistBPS ? ' <span class="ct">½ Rage</span>' : ''}</button>` : ''}</div>
    <div class="pad">${pad}</div>
    <div class="hpacts"><button class="dmg" data-act="hp" data-arg="dmg">Damage</button><button class="heal" data-act="hp" data-arg="heal">Heal</button><button class="tmpb" data-act="hp" data-arg="temp">Temp HP</button><button data-act="hp" data-arg="half">Half dmg</button></div>
  </section>`;
}

function hpRing(cur, max, tmp, blood) {
  const c = 120, r = 100, arc = .78, rot = 90 + (1 - arc) * 180, C = 2 * Math.PI * r, r2 = r + 12, C2 = 2 * Math.PI * r2;
  const f = Math.max(0, Math.min(1, cur / max)), tf = Math.min(1, tmp / max), toff = f + tf <= 1 ? f : Math.max(0, 1 - tf);
  const ticks = Array.from({ length: 11 }, (_, i) => { const a = (rot + i * arc * 36) * Math.PI / 180, h = i === 5, r1 = 84, rr = h ? 74 : 79; return `<line x1="${(c + Math.cos(a) * r1).toFixed(1)}" y1="${(c + Math.sin(a) * r1).toFixed(1)}" x2="${(c + Math.cos(a) * rr).toFixed(1)}" y2="${(c + Math.sin(a) * rr).toFixed(1)}" style="stroke:var(${h ? '--bad' : '--line'})" stroke-width="${h ? 3 : 1.5}"/>`; }).join('');
  return `<div class="ring${blood ? ' bl' : ''}${cur === 0 ? ' down' : ''}" ${xa('hpmax')}><svg viewBox="0 0 240 240" aria-hidden="true"><g transform="rotate(${rot} ${c} ${c})">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke-width="15" style="stroke:var(--line)" stroke-dasharray="${(C * arc).toFixed(1)} ${C.toFixed(1)}"/>
    <circle class="hpf" cx="${c}" cy="${c}" r="${r}" fill="none" stroke-width="15" stroke-dasharray="${(C * arc * f).toFixed(1)} ${C.toFixed(1)}"/>
    ${tmp ? `<circle cx="${c}" cy="${c}" r="${r2}" fill="none" stroke-width="6" style="stroke:var(--temp)" stroke-dasharray="${(C2 * arc * tf).toFixed(1)} ${(C2 * 2).toFixed(1)}" stroke-dashoffset="${(-C2 * arc * toff).toFixed(1)}"/>` : ''}</g>${ticks}</svg>
    <div class="ctr"><span class="big">${cur}</span><span class="of">of ${max}</span>${tmp ? `<span class="tmp">+${tmp} TEMP</span>` : ''}</div>
    <div class="bl-at">${blood ? 'BLOODIED' : 'BLOODIED AT ' + Math.floor(max / 2)}</div></div>`;
}
function savesHTML(c) {
  return `<section class="panel"><div class="ph"><h2>Saving Throws</h2></div><div class="rows">${ABIL.map(a => {
    const st = R.stats['save_' + a];
    return `<div class="row${ovc('save_' + a)}" ${xa('save_' + a)}><button class="pm ${c.saves.includes(a) ? 'p1' : ''}" data-act="saveprof" data-arg="${a}" aria-label="Toggle ${ABN[a]} save proficiency"><i></i></button><span class="nm">${ABN[a]}</span><span class="val">${sgn(st.v)}${diceSmall(st)}</span></div>`;
  }).join('')}</div></section>`;
}
function abilHTML(c) {
  return `<section class="panel hot"><div class="ph"><h2>Abilities</h2><button class="btn sm edit-only" data-act="form" data-arg="abil">${I.edit} Scores</button></div>${gemsHTML(c, false)}</section>`;
}
function gemsHTML(c, withSaves) {
  return `<div class="abil${withSaves ? ' six' : ''}">${ABIL.map(a => `<div class="gemcol"><div class="ab gem${ovc('abil_' + a)}${c.casting && c.casting.ability === a ? ' hi' : ''}" ${xa('abil_' + a)}><div class="gi"><div class="lbl">${ABN[a].slice(0, 3)}</div><div class="m">${sgn(R.mods[a])}</div><span class="s">${c.abilities[a]}</span></div></div>${withSaves ? `<div class="gsv${c.saves.includes(a) ? ' p' : ''}${ovc('save_' + a)}" ${xa('save_' + a)}>save <b>${sgn(R.stats['save_' + a].v)}</b></div>` : ''}</div>`).join('')}</div>`;
}
function skillsHTML(c) {
  return `<section class="panel"><div class="ph"><h2>Skills</h2><span class="muted" style="font-size:.8em">○ none ● proficient ◆ expertise</span></div><div class="rows">${SKILLS.map(([k, a, n]) => {

  }).join('')}</div>
  <div class="chips" style="margin-top:10px"><span class="passive${ovc('passive')}" ${xa('passive')}>Passive Perception <b>${R.stats.passive.v}</b></span><span class="passive" ${xa('passive_ins')}>Insight <b>${R.stats.passive_ins.v}</b></span><span class="passive" ${xa('passive_inv')}>Investigation <b>${R.stats.passive_inv.v}</b></span></div></section>`;
}
function hitDiceHTML(c) {
  return `<section class="panel"><div class="ph"><h2>Hit Dice</h2><span class="muted">Spend on a Short Rest</span></div>${c.hitDice.map((h, i) => `<div class="res"><div class="nm"><b>d${h.die}</b> ${esc(h.cls)}<small>${h.max - h.used} of ${h.max} left</small></div><div class="mini-pips">${Array.from({ length: h.max }, (_, j) => `<i class="${j < h.max - h.used ? '' : 'u'}"></i>`).join('')}</div><button class="btn sm" data-act="hd" data-arg="${i}" ${h.used >= h.max ? 'disabled' : ''}>Spend</button></div>`).join('')}</section>`;
}
function condHTML(c) {

  <div class="chips">${CONDITIONS.map(k => `<button class="chip bad ${c.conditions.includes(k) ? 'on' : ''}" data-act="cond" data-arg="${k}">${k}</button>`).join('')}</div>
  ${c.exhaustion ? `<p class="muted" style="margin:10px 0 0">${c.ruleset === '2024' ? `Exhaustion ${c.exhaustion}: −${2 * c.exhaustion} to every D20 Test and −${5 * c.exhaustion} ft speed (already applied).` : 'Exhaustion (2014): see the level table. Level 1 is disadvantage on ability checks.'} Level 6 is death.</p>` : ''}</section>`;
}
function featuresHTML(c) {

}
function resPips(c, rid) { const r = c.resources.find(x => x.id === rid); return r ? `<span class="tag m">${r.cur}/${r.max}</span>` : ''; }

function sheetHTML(c) {
  return `<div class="grid3">
    <div class="stack">${abilHTML(c)}${savesHTML(c)}</div>
    <div class="stack">${skillsHTML(c)}</div>
    <div class="stack col3">${hpPanel(c, false)}<section class="panel"><div class="ph"><h2>Defenses & Speed</h2><button class="btn sm edit-only" data-act="form" data-arg="identity">${I.edit} Core</button></div>${vitalsTiles(c, false)}<p class="dicemode" style="margin:10px 0 0">Tap any number for a big-print roll card. Long-press (or hover the S Pen) to see the math. Double-tap to override it.</p></section>${hitDiceHTML(c)}${condHTML(c)}${featuresHTML(c)}</div>
  </div>`;

/* --- slots & resources --- */
function slotsHTML(c) {
  if (!c.slots.length) return c.casting ? `<section class="panel"><div class="ph"><h2>Spell Slots</h2><button class="btn sm edit-only" data-act="form" data-arg="slots">${I.edit}</button></div><div class="empty">No slots set.</div></section>` : '';
  return `<section class="panel hot"><div class="ph"><h2>Spell Slots</h2><button class="btn sm edit-only" data-act="form" data-arg="slots">${I.edit} Slots</button></div><div class="slots">${c.slots.map((s, i) => `<div class="slotrow"><span class="lv">${s.label ? esc(s.label) + ' ' : ''}${ord(s.lvl)}</span>${Array.from({ length: s.max }, (_, j) => `<button class="pip ${j >= s.max - s.used ? 'used' : ''}" id="pip-${i}-${j}" data-act="pip" data-arg="${i}:${j}" aria-label="${ord(s.lvl)} level slot ${j + 1}"></button>`).join('')}<span class="muted">${s.rest === 'short' ? 'Short rest' : 'Long rest'}</span></div>`).join('')}</div></section>`;
}
const ord = n => n === 0 ? 'Cantrip' : n + (['th', 'st', 'nd', 'rd'][n] || 'th');
function resourcesHTML(c) {
  return `<section class="panel"><div class="ph"><h2>Resources & Charges</h2><button class="btn sm edit-only" data-act="add" data-arg="resource">${I.plus} Add</button></div>${c.resources.map(r => `<div class="res"><div class="nm"><b>${esc(r.name)}</b><small>${{ short: 'Recharges on Short Rest', long: 'Recharges on Long Rest', dawn: 'Regains ' + (r.regain || 'all') + ' at dawn', none: 'Does not recharge' }[r.rest] || ''}${r.note ? ' · ' + esc(r.note) : ''}</small></div>
    ${r.max <= 10 ? `<div class="mini-pips">${Array.from({ length: r.max }, (_, j) => `<i class="${j < r.cur ? '' : 'u'}"></i>`).join('')}</div>` : ''}
    <div class="step"><button data-act="res" data-arg="${r.id}:-1" aria-label="Use one">−</button><span>${r.cur}/${r.max}</span><button data-act="res" data-arg="${r.id}:1" aria-label="Regain one">+</button></div>
    ${r.rest === 'dawn' && r.regain ? `<button class="btn sm" data-act="dawn" data-arg="${r.id}">Dawn: ${esc(r.regain)}</button>` : ''}
    <button class="btn sm edit-only" data-act="edititem" data-arg="resource:${r.id}">${I.edit}</button></div>`).join('') || '<div class="empty">Track rage, ki, wand charges, anything with uses.</div>'}</section>`;
}
function summonsHTML(c) {
  if (!c.summons.length && !ui.editing) return '';
  return `<section class="panel"><div class="ph"><h2>Companions & Forms</h2><button class="btn sm edit-only" data-act="add" data-arg="summon">${I.plus} Add</button></div>${c.summons.map(m => {
    const p = Math.max(0, m.hp / m.max);
    return `<div class="res"><div class="nm"><b>${esc(m.name)}</b> <span class="tag">AC ${m.ac}</span>${m.absorb ? `<button class="chip ${m.active ? 'on' : ''}" data-act="formtoggle" data-arg="${m.id}" style="min-height:34px;padding:4px 10px">${m.active ? 'Form active' : 'Assume form'}</button>` : ''}<small>${esc(m.note || '')}</small>
      <div class="hpbar" style="height:14px;margin-top:6px"><div class="f" style="width:${p * 100}%;background:hsl(${p * 120} 65% 45%)"></div></div></div>
      <div class="step"><button data-act="sumhp" data-arg="${m.id}:-1" aria-label="Damage 1">−</button><span>${m.hp}/${m.max}</span><button data-act="sumhp" data-arg="${m.id}:1" aria-label="Heal 1">+</button></div>
      <button class="btn sm edit-only" data-act="edititem" data-arg="summon:${m.id}">${I.edit}</button></div>`;
  }).join('') || '<div class="empty">Add a familiar, summon, or Wild Shape form. Forms can soak damage first.</div>'}</section>`;
}
function attacksHTML(c, onlySet) {
  const list = R.attacks.filter(a => !onlySet || a.inSet);
  return `<section class="panel hot"><div class="ph"><h2>Attacks</h2><button class="btn sm edit-only" data-act="add" data-arg="attack">${I.plus} Add</button></div>
  <div class="sets">${c.sets.map((s, i) => `<button class="chip ${c.activeSet === i ? 'on' : ''}" data-act="set" data-arg="${i}">${esc(s.name)}${s.shield ? ' <span class="ct">+shield</span>' : ''}</button>`).join('')}<button class="chip edit-only" data-act="add" data-arg="set">${I.plus} Set</button></div>
  ${list.map(a => `<div class="atk${ovc('atk_' + a.w.id)}" ${xa('atk_' + a.w.id)}><div class="an"><b>${esc(a.w.name)}</b><div>${a.w.mastery ? `<span class="tag m">${esc(a.w.mastery)}</span>` : ''}<span class="tag">${esc(a.w.props || '')}</span></div></div>
    <div class="hit">${sgn(a.hit.v)}<small>TO HIT${a.hit.dice.length ? ' ' + a.hit.dice.map(d => '+' + d).join(' ') : ''}</small></div>
    <div class="dm" ${xa('dmg_' + a.w.id)}>${esc(a.dmgTxt)}<small>${esc(a.w.type || '')}</small></div>
    ${ui.editing ? `<button class="btn sm" data-act="edititem" data-arg="attack:${a.w.id}" style="grid-column:1/-1">${I.edit} Edit</button>` : ''}</div>`).join('') || '<div class="empty">No attacks in this weapon set.</div>'}
  ${ui.editing && c.sets[c.activeSet] ? `<button class="btn sm" data-act="edititem" data-arg="set:${c.activeSet}">${I.edit} Edit this set</button>` : ''}</section>`;
}
function buffTray(c) {
  return `<section class="panel"><div class="ph"><h2>Buffs & Situations</h2><button class="btn sm edit-only" data-act="form" data-arg="buffs">${I.edit}</button></div><div class="chips">${c.buffs.filter(b => BUFFS[b]).map(b => `<button class="chip ${c.active[b] ? 'on' : ''}" data-act="buff" data-arg="${b}" title="${esc(BUFFS[b].desc)}">${BUFFS[b].label}${BUFFS[b].ac ? ` <span class="ct">+${BUFFS[b].ac} AC</span>` : ''}${BUFFS[b].atk ? ' <span class="ct">+1d4</span>' : ''}</button>`).join('')}</div>

/* --- combat --- */

      ${slotsHTML(c)}${resourcesHTML(c)}

        <div class="moves">${Array.from({ length: sq }, (_, i) => `<button class="${i < c.turn.move ? 'u' : ''}" data-act="move" data-arg="${i}" aria-label="Square ${i + 1}"></button>`).join('')}</div>
        <div class="btnrow" style="margin-top:8px"><button class="chip ${c.turn.dash ? 'on' : ''}" data-act="dash">Dash</button><button class="chip" data-act="moveclear">Reset move</button></div></section>
      ${summonsHTML(c)}

function laneItems(c, lane) {
  const out = [];
  if (lane === 'action') R.attacks.filter(a => a.inSet).forEach(a => out.push({ k: 'atk', id: a.w.id, n: a.w.name, s: sgn(a.hit.v) + ' · ' + a.dmgTxt }));
  c.spells.filter(s => s.time === lane && (s.lvl === 0 || c.slots.length)).forEach(s => out.push({ k: 'spell', id: s.id, n: s.name, s: (s.lvl ? ord(s.lvl) : 'Cantrip') + (s.conc ? ' · Conc.' : '') + (s.range ? ' · ' + s.range : '') }));
  c.features.filter(f => f.time === lane).forEach(f => { const r = f.res && c.resources.find(x => x.id === f.res); out.push({ k: 'feat', id: f.id, n: f.name, s: r ? r.cur + '/' + r.max + ' left' : (f.buff ? (c.active[f.buff] ? 'Active' : 'Toggle') : 'Feature') }); });
  (STD_ACTIONS[lane] || []).forEach(([n, s]) => out.push({ k: 'std', id: n, n, s, std: 1 }));
  return out;
}
function dockHTML(c) {
  const t = c.turn, open = DB.settings.dockOpen;
  const spent = { action: t.action >= R.actionsMax, bonus: t.bonus >= 1, reaction: t.reaction >= 1, free: false };
  return `<button class="dock-toggle" data-act="dock">${open ? 'Hide action bar' : 'Show action bar'}</button>
  <div class="wrap dock-in" ${open ? '' : 'hidden'}>${LANES.map(([k, n]) => `<section class="lane ${spent[k] ? 'spent' : k !== 'free' ? 'avail' : ''}" data-lane="${k}">
    <header><span class="gem"></span><b>${n}${k === 'action' && R.actionsMax > 1 ? ' ×' + (R.actionsMax - t.action) : ''}</b>${k !== 'free' ? `<button data-act="lane" data-arg="${k}">${spent[k] ? 'Spent' : 'Mark used'}</button>` : ''}${k === 'action' ? '<button data-act="extra" title="Action Surge, Haste">+1</button>' : ''}</header>
    <div class="cards">${laneItems(c, k).map(it => `<button class="card ${it.std ? 'std' : ''}" data-act="use" data-arg="${it.k}:${esc(it.id)}:${k}"><b>${esc(it.n)}</b><span>${esc(it.s)}</span></button>`).join('')}</div></section>`).join('')}
    <button class="endturn" data-act="endturn">End Turn<small>Round ${t.round}</small></button></div>`;
}

/* --- spells --- */
const LG = { action: 'A', bonus: 'B', reaction: 'R', free: 'F' };
function spellsHTML(c) {
  const f = ui.spellFilter, lf = ui.lvlFilter;
  const lvls = [...new Set(c.spells.map(s => s.lvl))].sort((a, b) => a - b);
  const list = c.spells.filter(s => (f === 'all' || (f === 'conc' && s.conc) || (f === 'ritual' && s.ritual) || s.time === f) && (lf === 'all' || s.lvl === +lf)).sort((a, b) => a.lvl - b.lvl || a.name.localeCompare(b.name));
  const glyph = t => `<span class="lg ${LG[t] || ''}" aria-hidden="true">${t === 'action' ? 'A' : ''}</span>`;
  return `<div class="stack">
    <section class="panel hot srail">
      ${c.slots.length ? `<div class="slots">${c.slots.map((s, i) => `<div class="slotrow"><span class="lv">${s.label ? esc(s.label) + ' ' : ''}${ord(s.lvl)}</span>${Array.from({ length: s.max }, (_, j) => `<button class="pip ${j >= s.max - s.used ? 'used' : ''}" id="pip-${i}-${j}" data-act="pip" data-arg="${i}:${j}" aria-label="${ord(s.lvl)} level slot ${j + 1}"></button>`).join('')}<span class="muted">${s.rest === 'short' ? 'Short rest' : 'Long rest'}</span></div>`).join('')}<button class="btn sm edit-only" data-act="form" data-arg="slots">${I.edit} Slots</button></div>` : `<div class="empty">${c.casting ? 'No slots set.' : 'No spellcasting ability set. Unlock editing and use Core to add one.'}</div>`}
      ${c.casting ? `<div class="tiles">${tile('dc', 'Save DC', R.stats.dc.v)}${tile('spellatk', 'Spell Atk', sgn(R.stats.spellatk.v) + diceSmall(R.stats.spellatk))}</div>` : ''}
      ${c.conc ? `<div class="concbox"><span class="rg"><i></i></span><div><b>${esc(c.conc)}</b><span>Concentrating</span></div><button class="btn sm" data-act="dropconc">Drop</button></div>` : `<div class="concbox off"><span class="rg"></span><div><b>Not concentrating</b><span>Casting a concentration spell shows it here</span></div></div>`}
    </section>
    <section class="panel"><div class="ph"><h2>Spellbook</h2><span class="btnrow"><button class="btn sm edit-only" data-act="srd">Search SRD</button><button class="btn sm edit-only" data-act="add" data-arg="spell">${I.plus} Add</button></span></div>

/* ---------- overlays ---------- */

  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), ms);

}
function modal(html, bind) {

  ov.querySelector('.scrim').addEventListener('click', e => { if (e.target.dataset.scrim) closeModal(); });

}
function closeModal() { $('#ov').innerHTML = ''; }
function hideXray() { const x = $('#xray'); if (x) x.remove(); ui.xray = null; }
function showXray(key, anchor, pinned) {
  const st = R.stats[key]; if (!st) return;
  anchor = anchor || document.querySelector(`[data-x="${key}"]`); if (!anchor) return hideXray();

    ${st.ov ? `<div class="note">Overridden: <b>${esc(st.ov.f)}</b>${st.ov.note ? ' · ' + esc(st.ov.note) : ''}. Calculated: <s>${st.base}</s></div>` : `<div class="note">= ${esc(eq)}</div>`}

    ${pinned ? `<div class="x-ov"><button data-act="override" data-arg="${key}">Override ✎</button><button data-act="xclose">Close</button></div>` : ''}`;

/* ---------- rolls ---------- */
const ROLLABLE = /^(abil_|save_|skill_|atk_|init|spellatk)/;

  }

/* ---------- HP engine ---------- */
function hpAct(kind) {
  const p = evalF(ui.hpIn, {}); if (!p || !p.n) { toast('<div class="t1">Type an amount first</div><div class="t2">You can enter sums like 7+5</div>', 1800); return; }
  let n = p.n; ui.hpIn = '';
  const c = C();
  if (ui.target !== 'me') {
    const m = c.summons.find(s => s.id === ui.target); if (!m) return;
    commit((kind === 'heal' ? 'Healed ' : 'Damaged ') + m.name + ' ' + n, c => { const s = c.summons.find(x => x.id === m.id); if (kind === 'heal') s.hp = Math.min(s.max, s.hp + n); else s.hp = Math.max(0, s.hp - (kind === 'half' ? Math.floor(n / 2) : n)); });
    return;
  }
  if (kind === 'heal') {
    commit('Healed ' + n, c => { const was = c.hp.cur; c.hp.cur = Math.min(R.stats.hpmax.v, c.hp.cur + n); if (was === 0) c.death = { s: 0, f: 0 }; });
    pendingAnim.push(['#hpPanel', 'flash-heal']); render(); return;
  }
  if (kind === 'temp') { commit('Temp HP set to ' + Math.max(n, c.hp.temp) + (n < c.hp.temp ? ' (kept higher value)' : ''), c => { c.hp.temp = Math.max(c.hp.temp, n); }); return; }
  // damage
  const notes = [];
  if (kind === 'half') { n = Math.floor(n / 2); notes.push('halved'); }
  else if (R.resistBPS && ui.bps) { n = Math.floor(n / 2); notes.push('halved by Rage'); }
  const raw = n;
  commit('Took ' + raw + ' damage' + (notes.length ? ' (' + notes.join(', ') + ')' : ''), c => {
    const form = c.summons.find(s => s.absorb && s.active);
    if (form && n > 0) { const take = Math.min(form.hp, n); form.hp -= take; n -= take; notes.push(form.name + ' absorbed ' + take); if (form.hp === 0) { form.active = false; notes.push('form drops'); } }
    const t = Math.min(c.hp.temp, n); c.hp.temp -= t; n -= t; if (t) notes.push(t + ' from temp HP');
    if (c.hp.cur === 0 && (raw > 0)) { if (n >= R.stats.hpmax.v) { c.death.f = 3; notes.push('massive damage'); } else { c.death.f = Math.min(3, c.death.f + 1); notes.push('death save failure'); } }
    else {
      const over = n - c.hp.cur; c.hp.cur = Math.max(0, c.hp.cur - n);
      if (c.hp.cur === 0) { c.death = { s: 0, f: 0 }; if (over >= R.stats.hpmax.v) { c.death.f = 3; notes.push('massive damage: instant death'); } else notes.push('down to 0 HP'); }
    }
  });
  ui.bps = false;
  pendingAnim.push(['#hpPanel', 'flash-dmg']); render();
  if (notes.length > 1 || notes.some(x => /absorb|temp|death|0 HP/.test(x))) toast('<div class="t1">−' + raw + ' HP</div><div class="t2">' + esc(notes.join(' · ')) + '</div>', 2600);
  const c2 = C();
  if (c2.conc && raw > 0) {
    if (c2.hp.cur === 0) { const name = c2.conc; dropConc('Concentration on ' + name + ' ends (0 HP)'); return; }
    const dc = Math.max(10, Math.floor(raw / 2)), dcc = c2.ruleset === '2024' ? Math.min(30, dc) : dc, sv = R.stats.save_con;
    modal(`<h2>Concentration check</h2><p>You took ${raw} damage while concentrating on <b>${esc(c2.conc)}</b>.</p>
      <div class="tiles"><div class="tile"><div class="lbl">Save DC</div><div class="v">${dcc}</div></div><div class="tile"><div class="lbl">CON save</div><div class="v">${fmtStat(sv)}</div></div></div>
      <div id="cres" class="muted">Roll your d20, or let the app roll.</div>
      <div class="btnrow"><button class="btn" data-m="roll">Roll for me</button><button class="btn pri" data-m="pass">I passed</button><button class="btn dng" data-m="fail">I failed: drop it</button></div>`, sh => {
      sh.addEventListener('click', e => {
        const m = e.target.dataset.m; if (!m) return;
        if (m === 'pass') closeModal();
        if (m === 'fail') { closeModal(); dropConc('Lost concentration on ' + c2.conc); }
        if (m === 'roll') { const a = d20(), bd = sv.dice.reduce((s, d) => s + rollDice(d, {}).total, 0), tot = a + sv.v + bd; const ok = tot >= dcc && a !== 1 || a === 20 && false; sh.querySelector('#cres').innerHTML = `<span style="font-size:2em;font-weight:800">${tot}</span> (d20 ${a} ${sgn(sv.v)}${bd ? ' +' + bd : ''}) vs DC ${dcc}: <b style="color:var(${tot >= dcc ? '--good' : '--bad'})">${tot >= dcc ? 'Held it' : 'Lost it'}</b>`; e.target.remove(); }
      });
    });
  }
}
function dropConc(label) {
  commit(label, c => { (c.concBuffs || []).forEach(b => delete c.active[b]); c.concBuffs = []; c.conc = null; });
}
function setConc(name, buffs, after) {
  const c = C();
  const go = () => { commit('Concentrating on ' + name, c => { (c.concBuffs || []).forEach(b => delete c.active[b]); c.conc = name; c.concBuffs = buffs || []; (buffs || []).forEach(b => c.active[b] = true); }); after && after(); };
  if (c.conc && c.conc !== name) {
    modal(`<h2>Drop ${esc(c.conc)}?</h2><p>You can only concentrate on one spell. Casting ${esc(name)} ends ${esc(c.conc)}.</p><div class="btnrow"><button class="btn" data-m="no">Keep ${esc(c.conc)}</button><button class="btn pri" data-m="yes">Switch to ${esc(name)}</button></div>`, sh => sh.addEventListener('click', e => { if (e.target.dataset.m === 'yes') { closeModal(); go(); } if (e.target.dataset.m === 'no') closeModal(); }));
  } else go();

/* ---------- economy / use ---------- */
function markLane(lane, label) {
  if (lane === 'free') return;
  commit(label || (TIME[lane] + ' used'), c => { if (lane === 'action') c.turn.action++; else c.turn[lane] = (c.turn[lane] || 0) + 1; });
}
function useItem(kind, id, lane) {
  const c = C();
  if (kind === 'atk') { markLane('action', 'Attacked with ' + (c.attacks.find(a => a.id === id) || {}).name); rollCard('atk_' + id); return; }
  if (kind === 'spell') return castSpell(id, lane);
  if (kind === 'std') {
    if (id === 'Dash') commit('Dash', c => { c.turn.dash = true; if (lane === 'action') c.turn.action++; else c.turn[lane]++; });
    else if (id === 'Dodge') commit('Dodge', c => { c.active.dodge = true; c.turn.action++; });
    else if (lane !== 'free') markLane(lane, id); else toast('<div class="t1">' + esc(id) + '</div>', 1200);
    return;
  }
  if (kind === 'feat') {
    const f = c.features.find(x => x.id === id); if (!f) return;
    const r = f.res && c.resources.find(x => x.id === f.res);
    if (f.buff && c.active[f.buff]) { commit(f.name + ' ended', c => { delete c.active[f.buff]; }); return; }
    if (r && r.cur <= 0) { toast(`<div class="t1">No ${esc(r.name)} uses left</div><div class="t2">Use the + on Resources if your DM allows it.</div>`); return; }
    let msg = f.name; let heal = 0, tmp = 0;
    if (f.heal) { const h = rollDice(f.heal, R.ctx); heal = h.total; msg += ': healed ' + heal + ' [' + h.detail.join(',') + ']'; }
    if (f.temp) { const t = evalF(f.temp, R.ctx); tmp = t ? t.n : 0; msg += ': ' + tmp + ' temp HP'; }
    commit(msg, c => {
      const rr = f.res && c.resources.find(x => x.id === f.res); if (rr) rr.cur--;
      if (f.buff) c.active[f.buff] = true;
      if (f.extraAction) c.turn.extra = (c.turn.extra || 0) + 1;
      if (heal) { c.hp.cur = Math.min(R.stats.hpmax.v, c.hp.cur + heal); }
      if (tmp) c.hp.temp = Math.max(c.hp.temp, tmp);
      if (lane !== 'free') { if (lane === 'action') c.turn.action++; else c.turn[lane] = (c.turn[lane] || 0) + 1; }
    });
    toast('<div class="t1">' + esc(msg) + '</div>' + (r ? `<div class="t2">${r.cur - 1} of ${r.max} ${esc(r.name)} left</div>` : ''), 2200);
  }
}
function castSpell(id, lane) {
  const c = C(), s = c.spells.find(x => x.id === id); if (!s) return;
  lane = lane || s.time;
  const finish = (slotIdx, sl) => {
    const apply = () => {
      let tmp = 0; if (s.temp) { const t = evalF(String(s.temp).replace(/SL/gi, sl), R.ctx); tmp = t ? t.n : 0; }
      commit('Cast ' + s.name + (sl ? ' at ' + ord(sl) + ' level' : ''), c => {
        if (slotIdx != null) c.slots[slotIdx].used++;
        if (tmp) c.hp.temp = Math.max(c.hp.temp, tmp);
        if (s.buff && !s.conc) c.active[s.buff] = true;
        if (lane && lane !== 'free' && TIME[lane]) { if (lane === 'action') c.turn.action++; else c.turn[lane] = (c.turn[lane] || 0) + 1; }
      });
      if (slotIdx != null) { const sl2 = C().slots[slotIdx]; pendingAnim.push([`#pip-${slotIdx}-${sl2.max - sl2.used}`, 'drain']); render(); }
      if (s.conc) setConc(s.name, s.buff ? [s.buff] : []);
      toast(`<div class="t1">${esc(s.name)}</div><div class="t2">${s.desc ? interp(s.desc, R).slice(0, 220) : ''}</div>`, 3000);
    };
    apply();
  };

    const q = sh.querySelector('#ddbq'), msg = sh.querySelector('#ddbmsg'), link = sh.querySelector('#ddblink');

    };

        finish(j);

    };
    sh.querySelector('#ddbf').addEventListener('submit', e => { e.preventDefault(); go(); });
    sh.addEventListener('click', e => {
      const b = e.target.closest('button,a'); if (!b) return;

      if (b.dataset.x2) closeModal();
      if (b.dataset.go) go();
      if (b.dataset.paste) { try { finish(JSON.parse(sh.querySelector('#ddbjson').value)); } catch (err) { msg.innerHTML = '<b style="color:var(--bad)">That text did not import.</b> ' + esc(err instanceof SyntaxError ? 'Make sure you copied the whole page (Select all).' : err.message); } }
    });
  });
}

/* ---------- pen ink canvas (pressure, palm rejection, barrel-button eraser) ---------- */
const INK = (() => {
  const st = { color: '#2b1d10', w: 3, hl: false, eraser: false, penOnly: true, page: 0, drawing: null };
  const el = document.createElement('div');
  el.innerHTML = `<div class="ink-tools" id="inkTools"></div><div class="ink-wrap" id="inkWrap"><canvas id="ink"></canvas><div class="ink-hint" id="inkHint"></div></div>`;
  const cv = el.querySelector('#ink'), cx = cv.getContext('2d'), wrap = el.querySelector('#inkWrap');
  const COLORS = [['#2b1d10', 'Ink'], ['#b3132f', 'Crimson'], ['#1f4fa8', 'Blue'], ['#2f7a3a', 'Green']];
  let W = 1000, H = 640, scale = 1;
  const pages = () => { const c = C(); if (!c.ink || !c.ink.length) c.ink = [[]]; if (st.page >= c.ink.length) st.page = c.ink.length - 1; return c.ink; };
  function tools() {
    const p = pages();
    el.querySelector('#inkTools').innerHTML = COLORS.map(([c, n]) => `<button class="swatch ${!st.eraser && !st.hl && st.color === c ? 'on' : ''}" style="background:${c}" data-ink="color" data-v="${c}" aria-label="${n}"></button>`).join('') +
      `<button class="chip ${st.hl ? 'on' : ''}" data-ink="hl">Highlighter</button><button class="chip ${st.eraser ? 'on' : ''}" data-ink="eraser">Eraser</button>
      <button class="chip" data-ink="w" data-v="-1">Thinner</button><button class="chip" data-ink="w" data-v="1">Thicker</button>
      <button class="chip ${st.penOnly ? 'on' : ''}" data-ink="pen">Pen only</button>
      <button class="chip" data-ink="undo">Undo stroke</button>
      <span style="flex:1"></span>
      <button class="chip" data-ink="prev" ${st.page ? '' : 'disabled'}>‹</button><span class="muted">Page ${st.page + 1} of ${p.length}</span><button class="chip" data-ink="next">${st.page === p.length - 1 ? '+ Page' : '›'}</button>
      <button class="chip" data-ink="clear">Clear page</button>`;
    el.querySelector('#inkHint').textContent = st.penOnly ? 'S Pen writes · hold the pen button to erase' : 'Finger or pen';
  }
  function fit() {
    const r = wrap.getBoundingClientRect(); if (!r.width) return;
    const dpr = window.devicePixelRatio || 1;
    const hCss = Math.max(420, Math.min(window.innerHeight - 220, r.width * 1.3));
    cv.style.height = hCss + 'px'; cv.width = r.width * dpr; cv.height = hCss * dpr;
    scale = r.width / W; H = hCss / scale; cx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    tools(); redraw();
  }
  function paper() {
    cx.clearRect(0, 0, W, H * 2); cx.fillStyle = '#f4ecda'; cx.fillRect(0, 0, W, H);
    cx.strokeStyle = 'rgba(80,110,160,.18)'; cx.lineWidth = 1.2; for (let y = 60; y < H; y += 38) { cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke(); }
    cx.strokeStyle = 'rgba(180,40,50,.25)'; cx.beginPath(); cx.moveTo(70, 0); cx.lineTo(70, H); cx.stroke();
  }
  function drawStroke(s) {
    const p = s.p; if (p.length < 3) return;
    cx.strokeStyle = s.c; cx.globalAlpha = s.a || 1; cx.lineCap = 'round'; cx.lineJoin = 'round';
    if (s.a < 1) { cx.lineWidth = s.w; cx.beginPath(); cx.moveTo(p[0], p[1]); for (let i = 3; i < p.length; i += 3) cx.lineTo(p[i], p[i + 1]); cx.stroke(); }
    else for (let i = 3; i < p.length; i += 3) { cx.lineWidth = s.w * (0.35 + (p[i + 2] / 100) * 1.3); cx.beginPath(); cx.moveTo(p[i - 3], p[i - 2]); cx.lineTo(p[i], p[i + 1]); cx.stroke(); }
    if (p.length === 3) { cx.beginPath(); cx.arc(p[0], p[1], s.w / 2, 0, 7); cx.fillStyle = s.c; cx.fill(); }
    cx.globalAlpha = 1;
  }
  function redraw() { paper(); (pages()[st.page] || []).forEach(drawStroke); if (st.drawing) drawStroke(st.drawing); }
  const pos = e => { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / scale), Math.round((e.clientY - r.top) / scale), Math.round((e.pressure || .5) * 100)]; };
  function eraseAt(x, y) { const pg = pages()[st.page]; const before = pg.length; for (let i = pg.length - 1; i >= 0; i--) { const p = pg[i].p; for (let j = 0; j < p.length; j += 3) if (Math.abs(p[j] - x) < 14 && Math.abs(p[j + 1] - y) < 14) { pg.splice(i, 1); break; } } if (pg.length !== before) redraw(); }
  let erasing = false;
  cv.addEventListener('pointerdown', e => {
    if (st.penOnly && e.pointerType === 'touch') return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    erasing = st.eraser || (e.pointerType === 'pen' && (e.buttons & 32 || e.buttons & 2));
    const [x, y, pr] = pos(e);
    if (erasing) { eraseAt(x, y); return; }
    st.drawing = { c: st.hl ? '#e8b923' : st.color, w: st.hl ? 18 : st.w, a: st.hl ? .35 : 1, p: [x, y, pr] };
  });
  cv.addEventListener('pointermove', e => {
    if (erasing && e.buttons) { const [x, y] = pos(e); eraseAt(x, y); return; }
    if (!st.drawing) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    evs.forEach(ev => st.drawing.p.push(...pos(ev)));
    const p = st.drawing.p, n = p.length;
    if (st.drawing.a < 1) redraw();
    else { const s = { ...st.drawing, p: p.slice(Math.max(0, n - 3 * (evs.length + 1))) }; drawStroke(s); }
  });
  const end = () => { if (erasing) { erasing = false; save(); return; } if (!st.drawing) return; pages()[st.page].push(st.drawing); st.drawing = null; redraw(); save(); };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('touchstart', e => { if (!st.penOnly) e.preventDefault(); }, { passive: false });
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-ink]'); if (!b) return; const k = b.dataset.ink, p = pages();
    if (k === 'color') { st.color = b.dataset.v; st.eraser = st.hl = false; }
    if (k === 'hl') { st.hl = !st.hl; st.eraser = false; }
    if (k === 'eraser') { st.eraser = !st.eraser; st.hl = false; }
    if (k === 'w') st.w = Math.max(1, Math.min(10, st.w + +b.dataset.v));
    if (k === 'pen') st.penOnly = !st.penOnly;
    if (k === 'undo') { p[st.page].pop(); save(); }
    if (k === 'prev') st.page = Math.max(0, st.page - 1);
    if (k === 'next') { if (st.page === p.length - 1) p.push([]); st.page++; save(); }
    if (k === 'clear') { if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = 'Tap again to clear'; b.classList.add('on'); return; } commit('Cleared notes page ' + (st.page + 1), c => { c.ink[st.page] = []; }); }
    tools(); redraw();
  });
  window.addEventListener('resize', () => { if (el.isConnected) fit(); });
  return { el, fit };
})();

document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); undo(); } if (e.key === 'Escape') { closeModal(); hideXray(); } });
window.addEventListener('resize', () => { if (DB.ui.mode === 'combat') sizeDock(); });
try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
render();

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
